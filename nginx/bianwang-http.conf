# ============================================================
# 辨妄阁 · 辟谣档案库 —— Nginx 站点配置（**HTTP 版：还没有证书时装这份**）
#
# 为什么要有第二份：生产环境暂时拿不到 SSL 证书，而 nginx/bianwang.conf 是
# "80 一律 301 到 https + 443 上证书"的形态——那份装上就直接 502/证书缺失，
# 站点根本不可达。这一份保留全部防护（限流、反爬指纹、数据文件封禁、CSP、
# 关闭 server_tokens），只去掉 TLS 与 HSTS，让"先用 HTTP 上线"成为一条**明确**
# 的路径，而不是靠删配置凑出来。
#
# 与 bianwang.conf **二选一**：两份的 limit_req_zone 同名，同时启用 nginx -t 会报
# duplicate zone 并拒绝加载（这是好事——不会静默变成两套规则混着用）。
#
# 拿到证书之后要做的事（顺序别反）：
#   1) 在仪表盘「访问协议」改回/改成你要的档位；
#   2) 换成 nginx/bianwang.conf（含 80→443 跳转与 HSTS），reload；
#   3) 确认 https 能开后，再删掉本文件的启用。
#      HSTS 一旦发布出去就很难撤回，所以 HTTP 版**故意不发** Strict-Transport-Security。
#
# 前端：/var/www/bianwang/dist（Vite 产物）
# 后端：127.0.0.1:8787（Node，仅监听回环）
# 用法：复制到 sites-available 后 nginx -t && systemctl reload nginx
# ============================================================

limit_req_zone $binary_remote_addr zone=bw_api:16m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=bw_page:16m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=bw_media:16m rate=120r/m;
limit_req_zone $binary_remote_addr zone=bw_login:8m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=bw_conn:16m;

# 抓取型客户端指纹：命中即要求携带会话，否则拒绝
map $http_user_agent $bw_bot {
    default        0;
    ""             1;
    ~*(scrapy|python-requests|python-urllib|go-http-client|okhttp|libwww|httpclient|curl|wget|masscan|zgrab|semrush|ahrefs|majestic|petalbot|bytespider|diffbot|extractor|spider|crawl) 1;
}

upstream bianwang_api {
    server 127.0.0.1:8787 keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name bianwang.example.org;

    root  /var/www/bianwang/dist;
    index index.html;

    # ---------- 反指纹与体积上限 ----------
    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout  20s;
    keepalive_timeout    30s;
    types_hash_max_size  2048;

    # ---------- 安全响应头（HTTP 版：无 HSTS、无 upgrade-insecure-requests） ----------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # 正文批注只用预置 class，因此无需 unsafe-inline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # ---------- 明文链路的现实提醒（写进响应头不方便被人看见，写在日志与文档里） ----------
    # 这条链路上口令与会话 cookie 都是可读的：只应在受信网段开放，别把 80 端口映射到公网。
    # 后端已把会话 cookie 的 Secure 交给**请求真实协议**判（见 DEVELOPMENT.md R-16），
    # 所以 HTTP 下 cookie 不会被浏览器静默拒收，表现是"能登录"而不是"密码对了却进不去"。

    # ---------- 压缩（含文本与图片白名单） ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ---------- 禁止访问的数据与隐藏文件 ----------
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(json|csv|log|env|bak|old|tmp|sqlite|sql|sh|ya?ml)$ {
        # 后端数据目录（posts.json / users.csv / security.log 等）绝不经 web 暴露
        deny all;
        return 404;
    }
    location ~ ^/(data|server|node_modules|\.git)/ {
        deny all;
        return 404;
    }

    autoindex off;

    # ---------- 登录：单独更严的限流 ----------
    location = /api/auth/login {
        limit_req   zone=bw_login burst=3 nodelay;
        limit_conn  bw_conn 8;
        if ($bw_bot) { return 403; }
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 镜像口令验印：单独收紧，挡住口令穷举 ----------
    location = /api/library/unlock {
        limit_req   zone=bw_login burst=4 nodelay;
        limit_conn  bw_conn 8;
        if ($bw_bot) { return 403; }
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 镜像取书：整本流式下发，关掉缓冲以免占满内存 ----------
    location ^~ /api/library/files/ {
        limit_req   zone=bw_api rate=6r/s burst=24 nodelay;
        limit_conn  bw_conn 8;
        if ($bw_bot) { return 403; }
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
        proxy_buffering        off;
        proxy_request_buffering off;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
    }

    # ---------- 镜像在线阅览：逐章取页 + 同域带令牌插图 ----------
    location ~ ^/api/library/[^/]+/(reader|asset) {
        limit_req  zone=bw_media burst=180 nodelay;
        limit_conn bw_conn 16;
        if ($bw_bot) { return 403; }
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 图片：签名短时效直链，由后端校验 exp+sig ----------
    location ^~ /api/media/ {
        limit_req  zone=bw_media burst=180 nodelay;
        add_header Cache-Control "private, max-age=1200" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 其余 API ----------
    location /api/ {
        limit_req  zone=bw_api burst=60 nodelay;
        limit_conn bw_conn 24;
        if ($bw_bot) { return 403; }
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 带哈希的构建产物：可长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- 外壳：SPA history 回退 ----------
    location / {
        limit_req  zone=bw_page burst=120 nodelay;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
