# ============================================================
# 辨妄阁 · 辟谣档案库 —— Nginx 站点配置
# 前端：/var/www/bianwang/dist（Vite 产物）
# 后端：127.0.0.1:8787（Node，仅监听回环）
# 用法：复制到 sites-available 后 nginx -t && systemctl reload nginx
# ============================================================

limit_req_zone $binary_remote_addr zone=bw_api:16m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=bw_page:16m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=bw_media:16m rate=120r/m;
limit_req_zone $binary_remote_addr zone=bw_login:8m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=bw_conn:16m;

# 抓取型客户端指纹：命中即要求携带会话，否则拒绝
map $http_user_agent $bw_bot {
    default        0;
    ""             1;
    ~*(scrapy|python-requests|python-urllib|go-http-client|okhttp|libwww|httpclient|curl|wget|masscan|zgrab|semrush|ahrefs|majestic|petalbot|bytespider|diffbot|extractor|spider|crawl) 1;
}

upstream bianwang_api {
    server 127.0.0.1:8787 keepalive 16;
}

# —— HTTP 一律跳转 HTTPS ——
server {
    listen      80;
    listen      [::]:80;
    server_name bianwang.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name bianwang.example.org;

    root  /var/www/bianwang/dist;
    index index.html;

    # ---------- TLS：仅 1.2/1.3，禁用压缩与弱套件 ----------
    ssl_certificate     /etc/letsencrypt/live/bianwang.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bianwang.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ---------- 反指纹与体积上限 ----------
    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout  20s;
    keepalive_timeout    30s;
    types_hash_max_size  2048;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # 正文批注只用预置 class，因此无需 unsafe-inline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ---------- 压缩（含文本与图片白名单） ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ---------- 禁止访问的数据与隐藏文件 ----------
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(json|csv|log|env|bak|old|tmp|sqlite|sql|sh|ya?ml)$ {
        # 后端数据目录（posts.json / users.csv / security.log 等）绝不经 web 暴露
        deny all;
        return 404;
    }
    location ~ ^/(data|server|node_modules|\.git)/ {
        deny all;
        return 404;
    }

    autoindex off;

    # ---------- 登录：单独更严的限流 ----------
    location = /api/auth/login {
        limit_req   zone=bw_login burst=3 nodelay;
        limit_conn  bw_conn 8;
        if ($bw_bot) { return 403; }
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 镜像口令验印：单独收紧，挡住口令穷举 ----------
    location = /api/library/unlock {
        limit_req   zone=bw_login burst=4 nodelay;
        limit_conn  bw_conn 8;
        if ($bw_bot) { return 403; }
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 镜像取书：整本流式下发，关掉缓冲以免占满内存 ----------
    location ^~ /api/library/files/ {
        limit_req   zone=bw_api rate=6r/s burst=24 nodelay;
        limit_conn  bw_conn 8;
        if ($bw_bot) { return 403; }
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
        proxy_buffering        off;
        proxy_request_buffering off;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
    }

    # ---------- 镜像在线阅览：逐章取页 + 同域带令牌插图，频率远高于普通接口 ----------
    location ~ ^/api/library/[^/]+/(reader|asset) {
        limit_req  zone=bw_media burst=180 nodelay;
        limit_conn bw_conn 16;
        if ($bw_bot) { return 403; }
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 图片：签名短时效直链，由后端校验 exp+sig ----------
    location ^~ /api/media/ {
        limit_req  zone=bw_media burst=180 nodelay;
        add_header Cache-Control "private, max-age=1200" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 其余 API ----------
    location /api/ {
        limit_req  zone=bw_api burst=60 nodelay;
        limit_conn bw_conn 24;
        if ($bw_bot) { return 403; }
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://bianwang_api;
        include    /etc/nginx/bianwang-proxy.inc;
    }

    # ---------- 带哈希的构建产物：可长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- 外壳：SPA history 回退 ----------
    location / {
        limit_req  zone=bw_page burst=120 nodelay;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
